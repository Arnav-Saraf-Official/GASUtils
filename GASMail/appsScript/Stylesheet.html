<style>
:root {
  --bg: #06090b;
  --panel-solid: #0c1114;
  --glass-heavy: rgba(11, 16, 20, 0.62);
  --panel: rgba(255, 255, 255, 0.03);
  --panel-2: rgba(255, 255, 255, 0.055);
  --panel-3: rgba(255, 255, 255, 0.09);
  --border: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(255, 255, 255, 0.15);
  --text: #f3f7f8;
  --text-2: #a3b3ba;
  --text-3: #66777e;
  --blue: #38bdf8;
  --teal: #2dd4bf;
  --green: #34d399;
  --red: #fb7185;
  --amber: #fbbf24;
  --accent: #46c0ee;
  --accent-hover: #6bd2f7;
  --accent-soft: rgba(70, 192, 238, 0.13);
  --ring: rgba(45, 212, 191, 0.25);
  --grad: linear-gradient(115deg, #0ea5e9 0%, #22d3ee 48%, #34d399 100%);
  --shadow-lg: 0 24px 70px rgba(0, 0, 0, 0.6);
  --r-sm: 9px;
  --r-md: 13px;
  --r-lg: 18px;
  --e-out: cubic-bezier(0.23, 1, 0.32, 1);
  --e-spring: cubic-bezier(0.32, 0.72, 0, 1);
  --mono: "Cascadia Code", Consolas, "SF Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(45, 212, 191, 0.35); color: #fff; }

/* ---------- CUSTOM SCROLLBAR ---------- */

::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #22d3ee, #34d399);
  border-radius: 999px;
  border: 3px solid var(--bg);
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, #67e8f9, #6ee7b7);
  border: 3px solid var(--bg);
  background-clip: padding-box;
}
::-webkit-scrollbar-corner { background: var(--bg); }
* { scrollbar-width: thin; scrollbar-color: #2aa9b8 var(--bg); }

:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ---------- AMBIENT GLOWS ---------- */

.glow {
  position: fixed;
  border-radius: 50%;
  filter: blur(140px);
  pointer-events: none;
  z-index: 0;
  opacity: 0.42;
}
.g1 { width: 560px; height: 560px; top: -200px; left: -150px; background: radial-gradient(circle, rgba(14, 165, 233, 0.3), transparent 65%); animation: drift1 28s ease-in-out infinite alternate; }
.g2 { width: 500px; height: 500px; top: 18%; right: -190px; background: radial-gradient(circle, rgba(45, 212, 191, 0.24), transparent 65%); animation: drift2 34s ease-in-out infinite alternate; }
.g3 { width: 460px; height: 460px; bottom: -180px; left: 32%; background: radial-gradient(circle, rgba(52, 211, 153, 0.18), transparent 65%); animation: drift3 40s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(80px, 55px) scale(1.14); } }
@keyframes drift2 { to { transform: translate(-65px, 75px) scale(0.92); } }
@keyframes drift3 { to { transform: translate(55px, -65px) scale(1.1); } }

.app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

/* ---------- SIDEBAR ---------- */

.sidebar {
  width: 224px;
  flex-shrink: 0;
  background: var(--glass-heavy);
  backdrop-filter: blur(24px) saturate(170%);
  -webkit-backdrop-filter: blur(24px) saturate(170%);
  border-right: 1px solid var(--border);
  box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.03);
  display: flex;
  flex-direction: column;
  padding: 18px 12px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 10px 20px; }
.brand-mark {
  width: 33px;
  height: 33px;
  border-radius: 10px;
  background: var(--grad);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 18px rgba(34, 211, 238, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4);
  flex-shrink: 0;
}
.brand-name {
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.03em;
  background: linear-gradient(90deg, #fff 25%, #9be8de 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

#nav { display: flex; flex-direction: column; gap: 3px; }
.nav-btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  padding: 9px 12px;
  border-radius: 10px;
  background: transparent;
  color: var(--text-2);
  border: none;
  cursor: pointer;
  font-size: 13.5px;
  font-family: inherit;
  transition: background 130ms ease-out, color 130ms ease-out, transform 100ms ease-out;
}
.nav-btn svg { width: 16px; height: 16px; opacity: 0.85; transition: opacity 130ms ease-out; }
.nav-btn:hover { background: var(--panel-2); color: var(--text); }
.nav-btn:hover svg { opacity: 1; }
.nav-btn:active { transform: scale(0.98); }
.nav-btn.active {
  background: linear-gradient(90deg, rgba(14, 165, 233, 0.17), rgba(52, 211, 153, 0.07));
  color: var(--text);
  font-weight: 600;
}
.nav-btn.active::before {
  content: "";
  position: absolute;
  left: -12px;
  top: 7px;
  bottom: 7px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--grad);
}
.sidebar-footer { margin-top: auto; padding: 12px 4px 0; border-top: 1px solid var(--border); }
.quota-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 11px;
  margin-top: 12px;
  border-radius: 11px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-2);
}
.quota-badge::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 999px;
  background: var(--text-3);
  flex-shrink: 0;
  transition: background 200ms ease-out;
}
.quota-badge.ok::before { background: var(--green); box-shadow: 0 0 8px rgba(52, 211, 153, 0.65); }
.quota-badge.warn::before { background: var(--amber); box-shadow: 0 0 8px rgba(251, 191, 36, 0.65); }
.quota-badge.crit::before { background: var(--red); box-shadow: 0 0 8px rgba(251, 113, 133, 0.65); }

/* ---------- MAIN ---------- */

.main { flex: 1; padding: 32px 38px 64px; max-width: 1140px; min-width: 0; }
.view { display: none; }
.view.active { display: block; animation: viewIn 300ms var(--e-spring); }
@keyframes viewIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
h1 { font-size: 21px; margin: 0 0 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
h3 {
  font-size: 11px;
  margin: 0 0 12px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 650;
}
.view-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 10px; flex-wrap: wrap; }
.view-head h1 { margin: 0; }

.card {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.032), rgba(255, 255, 255, 0.01));
  border: 1px solid var(--border);
  border-top-color: rgba(255, 255, 255, 0.1);
  border-radius: var(--r-lg);
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 10px 36px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.03);
  transition: border-color 200ms ease-out;
}
.card:hover { border-color: rgba(255, 255, 255, 0.12); }
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.tpl-card {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.038), rgba(255, 255, 255, 0.012));
  border: 1px solid var(--border);
  border-top-color: rgba(255, 255, 255, 0.1);
  border-radius: var(--r-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: transform 220ms var(--e-spring), border-color 200ms ease-out, box-shadow 200ms ease-out;
  animation: cardIn 400ms var(--e-spring) backwards;
  animation-delay: calc(var(--i, 0) * 45ms);
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@media (hover: hover) and (pointer: fine) {
  .tpl-card:hover {
    transform: translateY(-3px);
    border-color: rgba(34, 211, 238, 0.35);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 26px rgba(34, 211, 238, 0.08);
  }
}
.tpl-card h4 { margin: 0; font-size: 15px; letter-spacing: -0.01em; }
.tpl-card .subject { color: var(--text-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tpl-card .meta { font-size: 11.5px; color: var(--text-3); line-height: 2; }
.tpl-card .meta span {
  display: inline-block;
  background: var(--accent-soft);
  color: var(--accent);
  border-radius: 5px;
  padding: 1px 6px;
  margin-right: 4px;
  font-family: var(--mono);
  font-size: 10.5px;
}

/* ---------- FORMS ---------- */

.form-row { margin-bottom: 16px; }
.form-row > label,
.form-row > .row-flex > label,
.form-row > .compose-toolbar-label { display: block; margin-bottom: 6px; color: var(--text-2); font-size: 12.5px; font-weight: 500; letter-spacing: 0.01em; }
input[type=text], input[type=search], input[type=email], select, textarea {
  width: 100%;
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 13.5px;
  font-family: inherit;
  transition: border-color 140ms ease-out, box-shadow 160ms ease-out, background 140ms ease-out;
}
select option { background: var(--panel-solid); color: var(--text); }
input::placeholder, textarea::placeholder { color: var(--text-3); }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: rgba(45, 212, 191, 0.55);
  box-shadow: 0 0 0 3px var(--ring);
  background: rgba(255, 255, 255, 0.06);
}
textarea { resize: vertical; line-height: 1.5; }
#cmpBody, #massHtml, #massPlain, #tplHtml, #tplPlain, #impRows { font-family: var(--mono); font-size: 12.5px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row-flex { display: flex; gap: 8px; align-items: center; }
.row-flex select, .row-flex input { flex: 1; }
.compose-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }

input[type="radio"], input[type="checkbox"] { accent-color: var(--teal); }

.seg { display: flex; gap: 4px; background: rgba(255, 255, 255, 0.045); border: 1px solid var(--border); border-radius: 999px; padding: 3px; width: fit-content; }
.seg label {
  display: flex;
  gap: 6px;
  align-items: center;
  color: var(--text-2);
  cursor: pointer;
  padding: 4px 13px;
  border-radius: 999px;
  font-size: 12.5px;
  transition: background 150ms ease-out, color 150ms ease-out;
}
.seg label:hover { color: var(--text); }
.seg label:has(input:checked) { background: var(--grad); color: #fff; font-weight: 600; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--teal); outline-offset: 1px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }

.vars-panel {
  background: rgba(34, 211, 238, 0.05);
  border: 1px solid rgba(34, 211, 238, 0.16);
  padding: 14px;
  border-radius: var(--r-md);
  margin-bottom: 15px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
}
.vars-panel label { font-family: var(--mono); font-size: 11px; color: var(--teal); }

/* ---------- BUTTONS ---------- */

.btn {
  position: relative;
  overflow: hidden;
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 8px 15px;
  cursor: pointer;
  font-size: 13.5px;
  font-family: inherit;
  font-weight: 500;
  letter-spacing: 0.005em;
  transition: transform 100ms ease-out, background 140ms ease-out, border-color 140ms ease-out, color 140ms ease-out, box-shadow 200ms ease-out;
}
.btn:hover { border-color: rgba(255, 255, 255, 0.28); background: var(--panel-3); }
.btn:active { transform: scale(0.96); }
.btn-primary {
  background: var(--grad);
  border-color: transparent;
  color: #fff;
  font-weight: 650;
  box-shadow: 0 4px 18px rgba(14, 165, 233, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
}
.btn-primary::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: -80%;
  width: 50%;
  background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.35), transparent);
  transform: skewX(-20deg);
  transition: left 550ms var(--e-out);
}
@media (hover: hover) and (pointer: fine) {
  .btn-primary:hover {
    filter: brightness(1.1);
    box-shadow: 0 6px 26px rgba(34, 211, 238, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }
  .btn-primary:hover::after { left: 130%; }
}
.btn-danger { background: transparent; border-color: rgba(251, 113, 133, 0.45); color: var(--red); }
.btn-danger:hover { background: rgba(251, 113, 133, 0.1); border-color: var(--red); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { color: var(--text); background: var(--panel-2); border-color: var(--border); }
.btn-sm { padding: 5px 10px; font-size: 12.5px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn.loading { color: transparent !important; pointer-events: none; }
.btn.loading::after {
  content: "";
  position: absolute;
  width: 13px;
  height: 13px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-top-color: #fff;
  border-radius: 999px;
  left: 50%;
  top: 50%;
  margin: -7.5px 0 0 -7.5px;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- TABS ---------- */

.tabs { display: flex; gap: 2px; }
.tab {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-3);
  padding: 6px 13px;
  cursor: pointer;
  font-size: 12.5px;
  font-family: inherit;
  font-weight: 500;
  transition: color 140ms ease-out, border-color 140ms ease-out;
}
.tab:hover { color: var(--text-2); }
.tab.active { color: var(--text); border-bottom: 2px solid; border-color: var(--teal); }
.preview-frame {
  width: 100%;
  height: 340px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: #fff;
}

/* ---------- MISC ---------- */

.actions { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 8px; }
.hint { color: var(--text-3); font-size: 12.5px; }
.hidden { display: none !important; }

.table-card { overflow-x: auto; }
.table-card table { width: 100%; border-collapse: collapse; }
.table-card th {
  text-align: left;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-3);
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  font-weight: 650;
}
.table-card td {
  padding: 9px 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.045);
  font-size: 13.5px;
  vertical-align: top;
  transition: background 130ms ease-out;
}
.table-card tbody tr:hover td { background: rgba(34, 211, 238, 0.045); }
.table-card tr:last-child td { border-bottom: none; }
.table-card td.actions-cell { text-align: right; white-space: nowrap; }
.empty-row td { color: var(--text-3); text-align: center; padding: 26px; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 9px 2px 7px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
.badge.sent, .badge.completed { background: rgba(52, 211, 153, 0.13); color: var(--green); }
.badge.failed { background: rgba(251, 113, 133, 0.13); color: var(--red); }
.badge.pending, .badge.queued, .badge.running { background: rgba(251, 191, 36, 0.13); color: var(--amber); }
.badge.cancelled { background: var(--panel-2); color: var(--text-2); }

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(2, 4, 5, 0.68);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  transition: opacity 240ms var(--e-spring);
}
.modal-backdrop.closing { opacity: 0; }
.modal {
  background: rgba(13, 18, 22, 0.82);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  border: 1px solid var(--border-strong);
  border-top-color: rgba(255, 255, 255, 0.14);
  border-radius: 22px;
  padding: 26px;
  width: min(90vw, 1500px);
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 0 90px rgba(14, 165, 233, 0.07);
  transform-origin: center;
  transition: transform 300ms var(--e-spring), opacity 300ms ease-out;
}
@starting-style {
  .modal-backdrop:not(.closing) { opacity: 0; }
  .modal-backdrop:not(.closing) .modal { opacity: 0; transform: scale(0.95) translateY(14px); }
}
.closing .modal { opacity: 0; transform: scale(0.96) translateY(8px); transition-duration: 160ms; }

#toastHost {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  background: rgba(14, 19, 23, 0.9);
  backdrop-filter: blur(18px) saturate(170%);
  -webkit-backdrop-filter: blur(18px) saturate(170%);
  border: 1px solid var(--border-strong);
  border-top-color: rgba(255, 255, 255, 0.12);
  border-left: 3px solid var(--accent);
  padding: 11px 16px;
  border-radius: 12px;
  min-width: 240px;
  max-width: 380px;
  box-shadow: var(--shadow-lg);
  font-size: 13.5px;
  transition: transform 360ms var(--e-spring), opacity 320ms ease-out;
}
.toast.success { border-left-color: var(--green); box-shadow: var(--shadow-lg), 0 0 26px rgba(52, 211, 153, 0.13); }
.toast.error { border-left-color: var(--red); box-shadow: var(--shadow-lg), 0 0 26px rgba(251, 113, 133, 0.13); }
@starting-style {
  .toast:not(.leaving) { transform: translateX(30px) scale(0.97); opacity: 0; }
}
.toast.leaving {
  transform: translateX(30px) scale(0.97);
  opacity: 0;
  transition-duration: 150ms;
}

.code-sample {
  background: rgba(0, 0, 0, 0.42);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 13px;
  font-size: 12px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
  color: var(--text-2);
  font-family: var(--mono);
  line-height: 1.55;
}
code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 12px; font-family: var(--mono); }
.char-count { float: right; font-weight: 400; color: var(--text-3); font-size: 11.5px; }
.over-limit { color: var(--red) !important; }

/* ---------- CODE EDITOR ---------- */

.CodeMirror {
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-family: var(--mono) !important;
  font-size: 12.5px !important;
  line-height: 1.55 !important;
  background: rgba(0, 0, 0, 0.38) !important;
}
#view-compose .CodeMirror { height: 360px; }
#massManual .CodeMirror { height: 280px; }
.modal .CodeMirror { height: 54vh; }
.CodeMirror-scroll { max-height: none; }
.cm-s-material-darker .CodeMirror-gutters { background: rgba(0, 0, 0, 0.38); border-right: 1px solid var(--border); }
.cm-s-material-darker .CodeMirror-linenumber { color: var(--text-3); }
.cm-s-material-darker .CodeMirror-cursor { border-left-color: var(--text); }
.cm-s-material-darker .CodeMirror-selected { background: rgba(45, 212, 191, 0.22); }
.CodeMirror-focused { border-color: rgba(45, 212, 191, 0.55); box-shadow: 0 0 0 3px var(--ring); }

/* ---------- RESPONSIVE ---------- */

@media (max-width: 880px) {
  .app { flex-direction: column; }
  .sidebar {
    width: 100%;
    height: auto;
    flex-direction: row;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    position: static;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  .brand { padding: 0 8px 0 0; }
  .brand-name { display: none; }
  #nav { flex-direction: row; overflow-x: auto; flex: 1; }
  .nav-btn { white-space: nowrap; padding: 7px 10px; }
  .nav-btn.active::before { display: none; }
  .sidebar-footer { margin: 0; padding: 0; border-top: none; }
  .quota-badge { margin-top: 0; }
  .main { padding: 18px 16px 40px; }
