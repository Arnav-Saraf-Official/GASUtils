<style>
:root {
  --bg: #0f1115;
  --panel: #161a22;
  --panel-2: #1d2330;
  --border: #2a3142;
  --text: #e6e9ef;
  --muted: #8b93a7;
  --accent: #4f8cff;
  --accent-hover: #3d7bf0;
  --green: #34c07c;
  --red: #e5534b;
  --amber: #d9a53a;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 200px;
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px 10px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--accent); color: white;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 15px;
}
.brand-name { font-weight: 600; font-size: 16px; letter-spacing: .3px; }
#nav { display: flex; flex-direction: column; gap: 2px; }
.nav-btn {
  text-align: left; padding: 9px 12px; border-radius: 8px;
  background: transparent; color: var(--muted); border: none;
  cursor: pointer; font-size: 14px;
}
.nav-btn:hover { background: var(--panel-2); color: var(--text); }
.nav-btn.active { background: var(--panel-2); color: var(--text); font-weight: 600; }
.sidebar-footer { margin-top: auto; padding: 10px; }
.quota-badge {
  display: inline-block; padding: 4px 10px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--border);
  font-size: 12px; color: var(--muted);
}

.main { flex: 1; padding: 28px 32px; max-width: 1100px; }
.view { display: none; }
.view.active { display: block; }
h1 { font-size: 20px; margin: 0 0 18px; font-weight: 650; }
h3 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.view-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
.view-head h1 { margin: 0; }

.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; margin-bottom: 18px;
}
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.tpl-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.tpl-card h4 { margin: 0; font-size: 15px; }
.tpl-card .subject { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tpl-card .meta { font-size: 11.5px; color: var(--muted); }

.form-row { margin-bottom: 14px; }
.form-row label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12.5px; }
input[type=text], input[type=search], input[type=email], select, textarea {
  width: 100%; background: var(--panel-2); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 13.5px;
  font-family: inherit;
}
textarea { resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row-flex { display: flex; gap: 8px; align-items: center; }
.row-flex select, .row-flex input { flex: 1; }

.btn {
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 14px; cursor: pointer; font-size: 13.5px;
}
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-danger { background: transparent; border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: rgba(229,83,75,.12); }
.btn-ghost { background: transparent; }
.btn-sm { padding: 5px 9px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.tabs { display: flex; gap: 4px; margin-bottom: 6px; }
.tab {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  padding: 5px 12px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 12.5px;
  border-bottom: none;
}
.tab.active { color: var(--text); background: var(--panel-2); }
.preview-frame { width: 100%; height: 320px; border: 1px dashed var(--border); border-radius: 0 8px 8px 8px; background: white; }

.actions { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 6px; }
.hint { color: var(--muted); font-size: 12.5px; }
.seg { display: flex; gap: 18px; margin-bottom: 12px; }
.seg label { display: flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
.vars-panel {
  background: var(--panel-2); border: 1px solid var(--border);
  padding: 12px; border-radius: 8px; margin-bottom: 14px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;
}

.table-card table { width: 100%; border-collapse: collapse; }
.table-card th {
  text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px;
  color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border);
}
.table-card td { padding: 9px 10px; border-bottom: 1px solid rgba(42,49,66,.5); font-size: 13.5px; vertical-align: top; }
.table-card tr:last-child td { border-bottom: none; }
.table-card td.actions-cell { text-align: right; white-space: nowrap; }
.empty-row td { color: var(--muted); text-align: center; padding: 22px; }

.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
.badge.sent, .badge.completed { background: rgba(52,192,124,.15); color: var(--green); }
.badge.failed { background: rgba(229,83,75,.15); color: var(--red); }
.badge.pending, .badge.queued, .badge.running { background: rgba(217,165,58,.15); color: var(--amber); }
.badge.cancelled { background: var(--panel-2); color: var(--muted); }

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.55);
  display: flex; align-items: center; justify-content: center; z-index: 50;
}
.modal {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; width: min(560px, 92vw);
  max-height: 85vh; overflow-y: auto;
}
.hidden { display: none !important; }

#toastHost { position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--panel-2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
  padding: 11px 16px; border-radius: 8px; min-width: 240px; max-width: 380px;
  box-shadow: 0 6px 24px rgba(0,0,0,.4); animation: slideIn .2s ease-out; font-size: 13.5px;
}
.toast.success { border-left-color: var(--green); }
.toast.error { border-left-color: var(--red); }
@keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }

.code-sample {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all;
  color: var(--muted); font-family: Consolas, monospace;
}
code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.char-count { float: right; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.over-limit { color: var(--red) !important; }
</style>
